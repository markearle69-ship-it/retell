{% extends "base.html" %}
{% block body %}
<div class="card" style="max-width: 360px; margin: 4rem auto;">
  <h1>{{ portfolio.name }}</h1>
  <p class="muted">Sign in to view your leads.</p>
  {% if error %}<p style="color:#dc2626;">{{ error }}</p>{% endif %}
  <form method="post" action="/portal/{{ portfolio.slug }}/login">
    <label for="password" class="muted">Password</label><br />
    <input type="password" id="password" name="password" required
           style="width:100%; box-sizing:border-box; margin: 0.4rem 0 1rem;" />
    <button type="submit" style="width:100%;">Log in</button>
  </form>
</div>
{% endblock %}
